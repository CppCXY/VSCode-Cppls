name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Bundle the extension
        run: npm run bundle
      # **The contract between the two repositories.** `verify-server.mjs` drives the server binary the way the
      # extension does: the handshake on both transports, the capability list, and a diagnostics report that is
      # *pulled*. That last half is why this step exists — the server deleted `textDocument/publishDiagnostics`
      # (`cpp_ls` commit `d5fd21e`) and this checker went on waiting for it, unnoticed because nothing ran it.
      # The bundled binary is Windows-only, so the other runners skip: exit code 2 is "nothing to verify".
      - name: Verify the server contract
        shell: bash
        run: |
          set +e
          npm run verify:server
          status=$?
          if [ $status -eq 2 ]; then
            echo "no server binary for this platform — skipped"
            exit 0
          fi
          exit $status

  integration:
    name: Extension host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run extension host tests
        run: xvfb-run -a npm test