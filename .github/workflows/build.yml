name: Build VSIX

# **Every push packages the extension; a tag also releases and publishes it.**
#
# Each platform's package carries the language server built for *that* platform
# — downloaded from the server repository's release whose version
# `scripts/config.json` pins — and is marked with a `TargetPlatform` in its
# manifest, which is what makes VS Code install the right one.
#
# A push to `main` or `master`, a tag, or a manual dispatch builds all seven
# packages and keeps them as workflow artifacts. A tag goes further:
#
#   release   creates the GitHub release for the tag and attaches every `.vsix`;
#   publish   uploads the same `.vsix` files to the Marketplace, one per platform.
#
# The Marketplace upload needs the repository secret `VSCODE_RELEASE` (an Azure DevOps
# personal access token with the Marketplace's *Manage* scope). Without it the
# publish job fails with a message saying so — the release still exists, so the
# packages can be published by hand afterwards.

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
          - target: win32-arm64
          - target: linux-x64
          - target: linux-arm64
          - target: alpine-x64
          - target: darwin-x64
          - target: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      # **The tag and the manifest must agree before anything is built.** `vsce publish` refuses a version that does
      # not match the tag, but only after the packages exist — this fails in the first ten seconds instead.
      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle the extension
        run: npm run package

      # From the server's release, at the version `scripts/config.json` pins; the asset for this target is chosen by
      # `scripts/download-server.mjs`, and a 404 says which of the two (version or platform) is wrong.
      - name: Fetch the language server
        run: node scripts/download-server.mjs --target ${{ matrix.target }}

      - name: Package
        run: npx vsce package --no-dependencies --target ${{ matrix.target }} --out cppls-${{ matrix.target }}.vsix

      # **What `vsce` succeeded in packing, not what was meant to be packed**: the vsix manifest's TargetPlatform, the
      # binary for this platform, its size, and nothing from `temp/`, `src/` or `node_modules/`.
      - name: Check the package
        run: node scripts/check-vsix.mjs cppls-${{ matrix.target }}.vsix --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: cppls-${{ matrix.target }}.vsix
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: package
    # **The first thing a tag changes.** A branch build stops after the packages, with them available as artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true

      - name: Publish the release with every package
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: vsix/*.vsix
          generate_release_notes: true
          # A release, not a draft: the tag is the decision to release. Set this to `true` to review the assets before
          # they are visible, and publish it from the Releases page afterwards.
          draft: false

  publish:
    name: Publish to the Marketplace
    needs: package
    # **The second thing a tag changes.** Same packages, uploaded once per platform; the `TargetPlatform` inside each
    # `.vsix` is what the Marketplace uses to offer the right download.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true

      # **A missing token must say so**, not look like a publishing bug: the packages are already on the release, and
      # adding the secret and re-running this job is all that is needed.
      - name: Check the Marketplace token
        env:
          VSCE_PAT: ${{ secrets.VSCODE_RELEASE }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error title=VSCODE_RELEASE is not set::Add the repository secret VSCODE_RELEASE (Azure DevOps PAT with the Marketplace Manage scope), then re-run this job. The release already has every .vsix attached."
            exit 1
          fi

      # **One invocation per package**, so a failure names the platform it belongs to instead of a list of seven paths,
      # and `--skip-duplicate` makes a re-run after a partial failure safe.
      - name: Publish every platform
        env:
          VSCE_PAT: ${{ secrets.VSCODE_RELEASE }}
        run: |
          for package in vsix/*.vsix; do
            echo "publishing $package"
            npx vsce publish --packagePath "$package" --skip-duplicate
          done

      # **A platform-specific extension is one upload per target, and a listing with one target looks finished.**
      # Measured: `0.1.1` went up as `alpine-x64` alone and its page said "Works with: Alpine Linux 64 bit". This
      # asks the public gallery what the version has and fails when a platform the release ships is absent.
      #
      # **Ten minutes, because the listing appears slowly.** Measured on `0.1.2`: the first target was visible 48 s
      # after its upload and the last one seven minutes later, so a shorter window reports a published version as
      # missing. Each attempt prints what the gallery returned, which distinguishes "the uploads never ran" from
      # "the listing is not there yet".
      - name: Verify every platform reached the Marketplace
        run: node scripts/check-marketplace.mjs --attempts 20 --delay 30000
