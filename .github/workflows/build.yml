name: Build VSIX

# **Every push packages the extension; only a tag creates a release.**
#
# Each platform's package carries the language server built for *that* platform
# — downloaded from the server repository's release whose version
# `scripts/config.json` pins — and is marked with a `TargetPlatform` in its
# manifest, which is what makes VS Code install the right one.
#
# A push to `main` or `master`, a tag, or a manual dispatch builds all seven
# packages and keeps them as workflow artifacts. The `release` job is the only
# one that cares about the ref: it runs for a tag, and creates the release **as a
# draft** with every `.vsix` attached, so publishing the release (and uploading
# to the Marketplace) is the maintainer's click, not the workflow's. Flip `draft`
# to `false` below to make it public automatically.

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
          - target: win32-arm64
          - target: linux-x64
          - target: linux-arm64
          - target: alpine-x64
          - target: darwin-x64
          - target: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      # **The tag and the manifest must agree before anything is built.** `vsce publish` refuses a version that does
      # not match the tag, but only after the packages exist — this fails in the first ten seconds instead.
      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle the extension
        run: npm run package

      # From the server's release, at the version `scripts/config.json` pins; the asset for this target is chosen by
      # `scripts/download-server.mjs`, and a 404 says which of the two (version or platform) is wrong.
      - name: Fetch the language server
        run: node scripts/download-server.mjs --target ${{ matrix.target }}

      - name: Package
        run: npx vsce package --no-dependencies --target ${{ matrix.target }} --out cppls-${{ matrix.target }}.vsix

      # **What `vsce` succeeded in packing, not what was meant to be packed**: the vsix manifest's TargetPlatform, the
      # binary for this platform, its size, and nothing from `temp/`, `src/` or `node_modules/`.
      - name: Check the package
        run: node scripts/check-vsix.mjs cppls-${{ matrix.target }}.vsix --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: cppls-${{ matrix.target }}.vsix
          if-no-files-found: error

  release:
    name: Attach the packages to the release
    needs: package
    # **The one thing a tag changes.** A branch build stops here, with the packages available as artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: vsix/*.vsix
          generate_release_notes: true
          # The maintainer publishes it — see the note at the top of this file.
          draft: true
